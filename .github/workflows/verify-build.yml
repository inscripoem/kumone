name: Verify build pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app (universal, unsigned)
        run: |
          ARCHES="arm64 x86_64" FETCH_MLX_METALLIB=1 \
            Scripts/build-app.sh release

      - name: Zip macOS app
        run: ditto -c -k --keepParent .build/app/Kumone.app Kumone-macos-unsigned.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-macos-unsigned
          path: Kumone-macos-unsigned.zip

  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned iOS IPA
        run: |
          mkdir -p dist
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="0.0.0" CURRENT_PROJECT_VERSION="1" \
            build
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/Kumone-iOS-verify.ipa" Payload)

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-ios-unsigned-ipa
          path: dist/Kumone-iOS-verify.ipa
